server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Build assets carry a content hash in the filename, so they can be cached
  # hard without going stale.
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # React Router owns the URLs. Serve a real file if one exists, otherwise
  # hand back index.html so a reload of /vehicles/clarence still works.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
